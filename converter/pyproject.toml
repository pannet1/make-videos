[project]
name = "open-converter"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
description = "Agentic-workflow project"
dependencies = [
    "aiosqlite",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "toolkit",
    "uvicorn[standard]",
    "watchdog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
toolkit = { git = "https://github.com/pannet1/toolkit.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
